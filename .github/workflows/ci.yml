name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            gir1.2-gtk-3.0 \
            libgtk-3-0 \
            python3-gi

      - name: Compile Python sources
        run: |
          python3 -m py_compile \
            src/x11_backend.py \
            tests/test_x11_backend.py \
            tests/x11_backspace_regression.py \
            tests/x11_interaction.py \
            tests/x11_live_markdown.py \
            tests/x11_reference_copy.py

      - name: Run headless unit tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test_wayland_core.mjs

      - name: Test session-aware installation
        run: tests/install_smoke.sh

      - name: Test end-user release archive
        run: tests/package_release_smoke.sh

      - name: Check extension and shell syntax
        run: |
          node --check src/gnome-shell/stickymd@local/extension.js
          node --check src/gnome-shell/stickymd@local/extension-modern.js
          node --check src/gnome-shell/stickymd@local/wayland-core.js
          python3 -m json.tool \
            src/gnome-shell/stickymd@local/metadata.json >/dev/null
          python3 -m json.tool \
            src/gnome-shell/stickymd@local/metadata-modern.json >/dev/null
          sh -n \
            scripts/install.sh \
            scripts/package-extensions.sh \
            scripts/package-release.sh \
            scripts/uninstall.sh \
            src/stickymd \
            tests/install_smoke.sh \
            tests/package_release_smoke.sh \
            tests/x11_properties.sh

      - name: Validate desktop entries
        run: |
          desktop_output=$(mktemp -d)
          for template in \
            data/autostart/stickymd.desktop.in \
            data/applications/stickymd.desktop.in \
            data/applications/stickymd-new.desktop.in
          do
            output_name=$(printf '%s' "${template%.in}" | tr '/' '-')
            sed 's|@EXECUTABLE@|/home/runner/.local/bin/stickymd|g' \
              "$template" > "$desktop_output/$output_name"
          done
          desktop-file-validate "$desktop_output"/*.desktop
